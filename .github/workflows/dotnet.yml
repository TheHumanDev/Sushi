name: .NET 11

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install TypeScript dependencies
        run: npm ci
      - name: Generate syntax grammars
        run: npm run generate:syntax
      - name: Compile VS Code extension
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
      - name: Restore dependencies
        run: dotnet restore Sushi.slnx
      - name: Build
        run: dotnet build Sushi.slnx --no-restore
      - name: Test
        run: dotnet test Sushi.Testing/Sushi.Testing.csproj --no-build --verbosity normal

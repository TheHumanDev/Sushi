
name: Publish Sushi VS Code Extension

on:
  workflow_dispatch:

concurrency:
  group: sushi-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows x64 pre-release
    if: github.ref == 'refs/heads/v0.1.0-alpha'
    runs-on: windows-latest
    environment: marketplace

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Install npm dependencies
        run: npm ci

      - name: Verify VSCE version
        shell: pwsh
        run: |
          npm exec -- vsce --version

      - name: Lint extension
        run: npm run lint

      - name: Test Sushi
        run: dotnet test Sushi.Testing/Sushi.Testing.csproj -c Release

      - name: Build VSIX
        run: npm run package:vsix

      - name: Archive VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sushi-win32-x64
          path: vsix/*.vsix
          if-no-files-found: error
      - name: Publish to VS Code Marketplace
        shell: pwsh
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $packagePath = "vsix/$($manifest.name)-win32-x64-$($manifest.version).vsix"
              
          if (-not (Test-Path $packagePath)) {
              throw "VSIX not found: $packagePath"
          }
              
          npm exec -- vsce publish --oidc --packagePath $packagePath
  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download VSIX
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sushi-win32-x64
          path: vsix

      - name: Generate checksum manifest
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem vsix -Filter "*.vsix")

          if ($packages.Count -ne 1) {
              throw "Expected exactly one VSIX, found $($packages.Count)."
          }

          $package = $packages[0]
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content vsix/SHA256SUMS -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $properties = Get-Content Directory.Build.props -Raw
          $version = [regex]::Match($properties, '<Version>\s*([^<]+)</Version>').Groups[1].Value

          if (-not $version) {
              throw "Unable to determine Sushi assembly version."
          }

          $tag = "v$version"
          $packagePath = "vsix/$($manifest.name)-win32-x64-$($manifest.version).vsix"
          $notesPath = ".github/release-notes/$tag.md"

          if (-not (Test-Path $packagePath)) {
              throw "VSIX not found: $packagePath"
          }

          if (-not (Test-Path $notesPath)) {
              throw "Release notes not found: $notesPath"
          }

          gh release create $tag $packagePath "vsix/SHA256SUMS" `
              --target $env:GITHUB_SHA `
              --title "Sushi $tag" `
              --notes-file $notesPath `
              --prerelease `
              --latest=false
